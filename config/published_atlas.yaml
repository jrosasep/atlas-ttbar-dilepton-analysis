publication:
  title: Observation of quantum entanglement with top quarks at the ATLAS detector
  arxiv: "2311.07288"
  doi: "10.1038/s41586-024-07824-z"
  analysis_reference: TOPQ-2021-24
  centre_of_mass_energy_tev: 13.0
  luminosity_fb_inverse: 140.0
  data_years: [2015, 2016, 2017, 2018]

regions:
  signal:
    label: "340 < m_ttbar < 380 GeV"
    observed: {value: -0.537, stat: 0.002, syst: 0.019}
    expected: {value: -0.470, stat: 0.002, syst: 0.017}
  validation_mid:
    label: "380 < m_ttbar < 500 GeV"
    observed: {value: -0.265, stat: 0.001, syst: 0.019}
    expected: {value: -0.258, stat: 0.001, syst: 0.019}
  validation_high:
    label: "m_ttbar > 500 GeV"
    observed: {value: -0.093, stat: 0.001, syst: 0.021}
    expected: {value: -0.103, stat: 0.001, syst: 0.021}

signal_systematics:
  signal_modelling: 0.017
  electrons: 0.002
  muons: 0.001
  jets: 0.004
  b_tagging: 0.002
  missing_transverse_momentum: 0.002
  backgrounds: 0.005
  # The paper reports pile-up as <0.001; zero is used in the quadrature check.
  pile_up: 0.0

particle_level_boundaries:
  powheg_pythia:
    value: -0.322
    uncertainty: 0.009
  powheg_herwig:
    value: -0.270
    uncertainty: null
